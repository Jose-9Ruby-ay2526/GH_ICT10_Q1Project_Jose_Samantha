<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: 'Courier New', Courier, monospace;
        background: linear-gradient(135deg, #fff0f6, #ffd6e7);
        color: #5a3042;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 25px;
    }

    nav {
        width: 100%;
        max-width: 900px;
        background: white;
        padding: 14px 24px;
        border-radius: 18px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 6px 20px rgba(190, 70, 120, 0.15);
        margin-bottom: 35px;
    }

    .logo {
        font-size: 1.4rem;
        font-weight: bold;
        color: #d94f87;
    }

    .nav-links {
        display: flex;
        gap: 20px;
    }

    .nav-links a {
        text-decoration: none;
        color: #9b4267;
        font-weight: bold;
        transition: 0.2s;
    }

    .nav-links a:hover {
        color: #e75491;
    }

    .container {
        width: 100%;
        max-width: 420px;
        background: white;
        border-radius: 22px;
        overflow: hidden;
        box-shadow: 0 12px 35px rgba(190, 70, 120, 0.2);
        border-top: 7px solid #e75491;
    }

    .card-header {
        text-align: center;
        padding: 22px;
        background: #fff5f9;
        border-bottom: 2px dashed #e7a5bd;
    }

    .card-header h2 {
        margin: 0;
        color: #d63f7a;
    }

    .card-body {
        padding: 25px;
    }

    .field-group {
        margin-bottom: 18px;
    }

    .field-group label {
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
        color: #8d4864;
    }

    input,
    select {
        width: 100%;
        padding: 11px;
        border: 2px solid #f1bfd2;
        border-radius: 10px;
        font-family: inherit;
        background: #fff9fb;
        color: #5a3042;
        outline: none;
    }

    input:focus,
    select:focus {
        border-color: #e75491;
        box-shadow: 0 0 0 3px #ffe1ec;
    }

    .action-btn {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #e75491, #d63f7a);
        color: white;
        font-family: inherit;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 5px 12px rgba(215, 63, 122, 0.25);
        transition: 0.2s;
    }

    .action-btn:hover {
        transform: translateY(-2px);
    }

    .results-box {
        margin-top: 22px;
        padding: 18px;
        background: #fff5f9;
        border-radius: 14px;
        border: 2px dashed #e7a5bd;
    }

    .results-box p {
        color: #a86a81 !important;
    }

    .display-sku {
        text-align: center;
        margin-top: 8px;
        font-size: 1.3rem;
        font-weight: bold;
        color: #d63f7a;
        letter-spacing: 1px;
    }

    footer {
        margin-top: 25px;
        color: #9b4267;
        font-size: 0.8rem;
    }
</style>
